; Example OPENTS.INI for a development install with loose HD shape art.
; Place it in the data directory: beside Game.exe, or in the directory -DATADIR= names.
;
; A written SearchPaths replaces the default of INI,MIX,Maps, so the default folders are
; named again after the HD folder. Folders are searched in the order written, and a loose
; file found in any of them stands in for the archived copy of the same name.

[Paths]
SearchPaths=HD,INI,MIX,Maps

; HD\SIDE1.SHP then replaces the sidebar art from the archives while
; [Video] AssetOverrides=yes (the default) in SUN.INI. A loose shape whose logical width
; and height are exactly twice the archived shape's is drawn as 2x art; HD\HDPACK.INI can
; state the scale outright:
;
; [Scale]
; SIDE1.SHP=2
